<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Interview Questions & Answers</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>ML Interview Questions & Answers</h1>
    </header>

    <main class="container my-5">
        <div class="row">
            <div class="col-md-12 text-center">
                <button class="btn btn-primary mx-2" onclick="loadQuestions('Supervised Learning')">Supervised Learning</button>
                <button class="btn btn-secondary mx-2" onclick="loadQuestions('Unsupervised Learning')">Unsupervised Learning</button>
                <button class="btn btn-success mx-2" onclick="loadQuestions('Deep Learning')">Deep Learning</button>
                <button class="btn btn-warning mx-2" onclick="loadQuestions('Data Preprocessing')">Data Preprocessing</button>
                <button class="btn btn-danger mx-2" onclick="loadQuestions('Model Evaluation')">Model Evaluation</button>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12" id="question-list">
                <h2>Welcome</h2>
                <p>This page contains a collection of Machine Learning interview questions and answers.</p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto"></footer>
        <p>&copy; 2025 ML Interview Questions & Answers</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/load_section.js"></script>
</body>
</html>
